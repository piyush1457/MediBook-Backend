services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: evepass
      POSTGRES_DB: eve
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://eve:evepass@db:5432/eve
      JWT_SECRET: change-me-to-a-long-random-secret
      WEBHOOK_SECRET: change-me-webhook-secret
      ADMIN_EMAIL: admin@eve.local
      ADMIN_PASSWORD: Adminpass123
      ADMIN_NAME: Admin
    ports:
      - "8000:8000"

volumes:
  pgdata:
